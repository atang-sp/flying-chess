name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Validate configuration fixtures
        run: npm run validate-config

      - name: Test
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Build room server
        run: npm run build:room-server

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: npx playwright install --with-deps chrome

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  room-server-operability:
    name: Room Server Operability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build room server
        run: npm run build:room-server

      - name: Run room server tests
        run: npm run test:room-server

      - name: Run ephemeral release smoke
        run: npm run test:room-server-smoke

      - name: Run 20-room and 160-connection load test
        run: npm run test:room-server-load

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify tests leave the checkout unchanged
        run: git diff --exit-code
