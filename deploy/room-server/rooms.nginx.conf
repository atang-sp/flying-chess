server {
  listen 80;
  listen [::]:80;
  server_name rooms.atang-sp.run.place;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/discourse/public;
  }

  location / {
    return 301 https://rooms.atang-sp.run.place$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name rooms.atang-sp.run.place;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /shared/ssl/atang-sp.run.place.cer;
  ssl_certificate /shared/ssl/atang-sp.run.place_ecc.cer;
  ssl_certificate_key /shared/ssl/atang-sp.run.place.key;
  ssl_certificate_key /shared/ssl/atang-sp.run.place_ecc.key;

  access_log off;
  client_max_body_size 16k;

  location / {
    proxy_pass http://172.17.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}

